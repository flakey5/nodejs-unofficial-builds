name: periodic

on:
  pull_request: # temp just to run in ci
  workflow_dispatch:
  # schedule:
  #   - cron: 'TODO'

jobs:
  check-releases:
    timeout-minutes: 5
    runs-on: ubuntu-lite # todo confirm name

    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: bin/periodic.sh
